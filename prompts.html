<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maicon Oliveira | Catálogo de Prompts de IA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Estilos customizados para o novo layout estilo vitrine */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }
    .product-card {
      background: #ffffff;
      color: #1f2937;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      text-align: center;
      transition: transform 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-5px);
    }
    .product-image-container {
      width: 100%;
      height: 160px;
      border-radius: 8px;
      overflow: hidden;
      background: #f3f4f6;
      margin-bottom: 12px;
    }
    .product-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product-title {
      font-size: 1rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .product-price-tag {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      margin: 10px 0;
    }
    .btn-action {
      background-color: #ef4444;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 8px 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      width: 80%;
      margin: 0 auto;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-action:hover {
      background-color: #dc2626;
    }
    .prompt-snippet {
      font-size: 0.8rem;
      color: #6b7280;
      background: #f9fafb;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <header class="glass">
    <div class="logo">MO.</div>
    <ul class="nav-links">
      <li><a href="index.html#home">Início</a></li>
      <li><a href="index.html#projects">Projetos</a></li>
      <li><a href="prompts.html" class="highlight-link">Catálogo AI</a></li>
    </ul>
  </header>

  <section class="container" style="margin-top: 140px;">
    <h2>Catálogo de Prompts de IA</h2>
    <p class="subtitle text-center" style="margin-bottom: 40px;">Explore os prompts gerados em formato de vitrine</p>
    
    <!-- Container onde os cards no novo formato serão injetados -->
    <div id="promptsContainer" class="catalog-grid">
      <p class="text-center" style="grid-column: 1 / -1; color: rgba(255,255,255,0.6);">A carregar prompts...</p>
    </div>
  </section>

  <footer>
    <p class="text-center" style="padding: 20px; color: rgba(255,255,255,0.5); font-size: 0.9rem;">© Maicon Oliveira</p>
  </footer>

  <!-- Script para buscar e renderizar os prompts do Firestore no novo layout -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_kNnxzQAJbW-oYQjJq5H3aR3ixonby1Q",
      authDomain: "portfolio-maicon-admin.firebaseapp.com",
      projectId: "portfolio-maicon-admin",
      storageBucket: "portfolio-maicon-admin.firebasestorage.app",
      messagingSenderId: "917407154594",
      appId: "1:917407154594:web:4e7276e0a163eafcd0f2fb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadPrompts() {
      const container = document.getElementById('promptsContainer');
      try {
        const q = query(collection(db, "ai_prompts"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) {
          container.innerHTML = '<p class="text-center" style="grid-column: 1 / -1; color: rgba(255,255,255,0.6);">Nenhum prompt cadastrado ainda.</p>';
          return;
        }

        container.innerHTML = '';
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <div>
              <div class="product-image-container">
                ${data.imageUrl ? `<img src="${data.imageUrl}" alt="${data.title}">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#9ca3af;"><i class="fa-solid fa-image fa-2x"></i></div>'}
              </div>
              <h3 class="product-title">${data.title}</h3>
              <div class="prompt-snippet" title="${data.promptText}">${data.promptText}</div>
            </div>
            <div>
              <div class="product-price-tag">Prompt IA</div>
              <button class="btn-action copy-btn" data-text="${data.promptText}">
                <i class="fa-solid fa-copy"></i> Copiar
              </button>
            </div>
          `;
          container.appendChild(card);
        });

        // Funcionalidade de clique para copiar o texto do prompt
        document.querySelectorAll('.copy-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const textToCopy = e.currentTarget.getAttribute('data-text');
            navigator.clipboard.writeText(textToCopy);
            const originalHTML = e.currentTarget.innerHTML;
            e.currentTarget.innerHTML = '<i class="fa-solid fa-check"></i> Copiado!';
            setTimeout(() => {
              e.currentTarget.innerHTML = originalHTML;
            }, 2000);
          });
        });

      } catch (error) {
        console.error("Erro ao carregar prompts:", error);
        container.innerHTML = '<p class="text-center" style="grid-column: 1 / -1; color: #ef4444;">Erro ao carregar os prompts do banco de dados.</p>';
      }
    }

    loadPrompts();
  </script>
</body>
</html>
